configuration:
  pageTitle: "HANK 的工具箱"
  pageTitleSuffix: " | 探索 · 记录 · 分享"
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: zh-CN
  baseUrl: hank7199.github.io/myblog
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: "Inter"
      body: "Inter"
      code: "Fira Code"
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#0a0a0f"
        lightgray: "#1a1a24"
        gray: "#666688"
        darkgray: "#b0b0cc"
        dark: "#e8e8f0"
        secondary: "#00d4ff"
        tertiary: "#a855f7"
        highlight: rgba(0, 212, 255, 0.08)
        textHighlight: "#fff23688"